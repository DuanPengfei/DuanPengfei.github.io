<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1090" viewBox="0 0 760 1090" role="img" aria-labelledby="harness-recursive-improvement-title harness-recursive-improvement-desc" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="harness-recursive-improvement-title">Harness 的递归自我改进：用升级后的自己继续优化自己</title>
  <desc id="harness-recursive-improvement-desc">同一个工程架构优化任务持续审查项目组织结构、代码抽象与复用、领域建模、异常处理、冗余代码和多模块耦合。当前 Harness v0 读取自身实现，产生候选 v1，经回归与影响评测后启动 v1。v1 的新模块进入下一轮自改执行链路，再产生候选 v2。收益需要独立评测。</desc>
  <defs>
    <marker id="harness-recursive-improvement-base" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#8696ac" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="harness-recursive-improvement-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#087f72" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <marker id="harness-recursive-improvement-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7450c7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="1088" rx="22" fill="#f7f9fc" stroke="#dce4ee" stroke-width="1" />
  <rect x="32" y="26" width="84" height="26" rx="13" fill="#e8eeff" stroke="#e8eeff" stroke-width="1" />
  <text x="74" y="44" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">01 · RSI</text>
  <text x="130" y="44" font-size="14" fill="#526178" font-weight="400" text-anchor="start">Harness 优化自己的工程架构 · 机制示意</text>
  <text x="32" y="88" font-size="28" fill="#17253d" font-weight="700" text-anchor="start">用升级后的自己，继续优化自己</text>
  <text x="32" y="119" font-size="15" fill="#526178" font-weight="400" text-anchor="start">优化对象可以是 Agent 的工具与运行流程，基础模型权重可以保持不变。</text>
  <text x="32" y="151" font-size="16" fill="#17253d" font-weight="600" text-anchor="start">同一个优化任务，持续审查六个方面</text>
  <rect x="32" y="169" width="224" height="72" rx="12" fill="#ffffff" stroke="#dce4ee" stroke-width="1" />
  <text x="48" y="197" font-size="16" fill="#17253d" font-weight="600" text-anchor="start">项目组织结构</text>
  <text x="48" y="222" font-size="14" fill="#526178" font-weight="400" text-anchor="start">模块职责与目录边界</text>
  <rect x="268" y="169" width="224" height="72" rx="12" fill="#ffffff" stroke="#dce4ee" stroke-width="1" />
  <text x="284" y="197" font-size="16" fill="#17253d" font-weight="600" text-anchor="start">代码抽象与复用</text>
  <text x="284" y="222" font-size="14" fill="#526178" font-weight="400" text-anchor="start">共享能力与重复实现</text>
  <rect x="504" y="169" width="224" height="72" rx="12" fill="#ffffff" stroke="#dce4ee" stroke-width="1" />
  <text x="520" y="197" font-size="16" fill="#17253d" font-weight="600" text-anchor="start">领域建模</text>
  <text x="520" y="222" font-size="14" fill="#526178" font-weight="400" text-anchor="start">实体、状态与职责划分</text>
  <rect x="32" y="253" width="224" height="72" rx="12" fill="#ffffff" stroke="#dce4ee" stroke-width="1" />
  <text x="48" y="281" font-size="16" fill="#17253d" font-weight="600" text-anchor="start">异常处理</text>
  <text x="48" y="306" font-size="14" fill="#526178" font-weight="400" text-anchor="start">分类、传播与恢复</text>
  <rect x="268" y="253" width="224" height="72" rx="12" fill="#ffffff" stroke="#dce4ee" stroke-width="1" />
  <text x="284" y="281" font-size="16" fill="#17253d" font-weight="600" text-anchor="start">冗余代码</text>
  <text x="284" y="306" font-size="14" fill="#526178" font-weight="400" text-anchor="start">无效分支与重复逻辑</text>
  <rect x="504" y="253" width="224" height="72" rx="12" fill="#ffffff" stroke="#dce4ee" stroke-width="1" />
  <text x="520" y="281" font-size="16" fill="#17253d" font-weight="600" text-anchor="start">多模块耦合</text>
  <text x="520" y="306" font-size="14" fill="#526178" font-weight="400" text-anchor="start">依赖方向与变更影响面</text>
  <text x="100" y="359" font-size="17" fill="#17253d" font-weight="600" text-anchor="start">版本更新进入下一轮改进</text>
  <rect x="100" y="380" width="628" height="112" rx="15" fill="#ffffff" stroke="#dce4ee" stroke-width="1" />
  <rect x="118" y="398" width="36" height="27" rx="8" fill="#e6edfd" stroke="none" stroke-width="1" />
  <text x="136" y="417" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle">01</text>
  <text x="166" y="419" font-size="19" fill="#17253d" font-weight="650" text-anchor="start">当前运行的 Harness</text>
  <text x="118" y="452" font-size="16" fill="#526178" font-weight="400" text-anchor="start">首轮使用 v0；后续轮次使用已采用的新版本。</text>
  <text x="118" y="476" font-size="16" fill="#526178" font-weight="400" text-anchor="start">读取自身源码与依赖，定位结构、复用、异常与耦合问题。</text>
  <rect x="100" y="530" width="628" height="120" rx="15" fill="#edf3ff" stroke="#dce4ee" stroke-width="1" />
  <rect x="118" y="548" width="36" height="27" rx="8" fill="#e6edfd" stroke="none" stroke-width="1" />
  <text x="136" y="567" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle">02</text>
  <text x="166" y="569" font-size="19" fill="#17253d" font-weight="650" text-anchor="start">产生候选 v1</text>
  <text x="118" y="602" font-size="16" fill="#526178" font-weight="400" text-anchor="start">示例：统一 ToolResult 与错误分类，</text>
  <text x="118" y="626" font-size="16" fill="#526178" font-weight="400" text-anchor="start">复用工具执行与反馈整理逻辑。</text>
  <rect x="100" y="688" width="628" height="112" rx="15" fill="#ffffff" stroke="#dce4ee" stroke-width="1" />
  <rect x="118" y="706" width="36" height="27" rx="8" fill="#e6edfd" stroke="none" stroke-width="1" />
  <text x="136" y="725" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle">03</text>
  <text x="166" y="727" font-size="19" fill="#17253d" font-weight="650" text-anchor="start">评测候选，再决定采用</text>
  <text x="118" y="760" font-size="16" fill="#526178" font-weight="400" text-anchor="start">回归既有行为与异常场景，</text>
  <text x="118" y="784" font-size="16" fill="#526178" font-weight="400" text-anchor="start">核查依赖方向、修改遗漏与变更影响面。</text>
  <rect x="100" y="838" width="628" height="126" rx="15" fill="#eaf7f2" stroke="#bee0d4" stroke-width="1" />
  <rect x="118" y="856" width="36" height="27" rx="8" fill="#d8eee5" stroke="none" stroke-width="1" />
  <text x="136" y="875" font-size="14" fill="#087f72" font-weight="700" text-anchor="middle">04</text>
  <text x="166" y="877" font-size="19" fill="#17253d" font-weight="650" text-anchor="start">启动并运行 Harness v1</text>
  <text x="118" y="910" font-size="16" fill="#526178" font-weight="400" text-anchor="start">新启动的 v1，用统一模块执行下一轮自身重构的检查与测试。</text>
  <text x="118" y="934" font-size="16" fill="#526178" font-weight="400" text-anchor="start">完整失败证据进入模型上下文，再产生候选 v2。</text>
  <path d="M 414 497 V 523" fill="none" stroke="#8696ac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#harness-recursive-improvement-base)" />
  <path d="M 414 655 V 681" fill="none" stroke="#8696ac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#harness-recursive-improvement-base)" />
  <path d="M 414 805 V 831" fill="none" stroke="#087f72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#harness-recursive-improvement-green)" />
  <text x="433" y="823" font-size="14" fill="#087f72" font-weight="400" text-anchor="start">加载新版，接替运行</text>
  <path d="M 94 901 H 70 V 436 H 94" fill="none" stroke="#087f72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#harness-recursive-improvement-green)" />
  <text x="44" y="642" font-size="15" fill="#087f72" font-weight="600" text-anchor="middle">递</text>
  <text x="44" y="665" font-size="15" fill="#087f72" font-weight="600" text-anchor="middle">归</text>
  <text x="44" y="688" font-size="15" fill="#087f72" font-weight="600" text-anchor="middle">反</text>
  <text x="44" y="711" font-size="15" fill="#087f72" font-weight="600" text-anchor="middle">馈</text>
  <circle cx="107" cy="1000" r="4" fill="#087f72" />
  <text x="121" y="1005" font-size="16" fill="#17253d" font-weight="600" text-anchor="start">关键：v1 的改动实际进入下一轮自改的执行链路。</text>
  <text x="100" y="1033" font-size="15" fill="#087f72" font-weight="600" text-anchor="start">v0 → 候选 v1 → 评测 → 运行 v1 → 候选 v2 → …</text>
  <text x="100" y="1061" font-size="14" fill="#526178" font-weight="400" text-anchor="start">待验证收益：修改遗漏、修复轮数、变更影响面与总成本。</text>
</svg>